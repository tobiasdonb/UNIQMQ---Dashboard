services:
  # Main Node.js Application (Express + MQTT Worker)
  app:
    build: ./app
    container_name: unimon_app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./app/.env
    depends_on:
      - db
    networks:
      - app-network

  # Database (MariaDB)
  db:
    image: mariadb:latest
    container_name: mariadb_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: unimq
      MYSQL_USER: user_app
      MYSQL_PASSWORD: password_app
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma_admin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
